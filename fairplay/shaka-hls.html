<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>FairPlay HLS Test</title>
</head>
<body>
    <video height="540px" width="960px" autoplay controls muted></video>
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4/dist/shaka-player.compiled.debug.js"></script>
    <script>
    (function() {
        // Axinom FairPlay test configuration
        var licenseUrl = 'https://drm-fairplay-licensing.axprod.net/AcquireLicense';
        var licenseToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ2ZXJzaW9uIjoxLCJjb21fa2V5X2lkIjoiNjllNTQwODgtZTllMC00NTMwLThjMWEtMWViNmRjZDBkMTRlIiwibWVzc2FnZSI6eyJ0eXBlIjoiZW50aXRsZW1lbnRfbWVzc2FnZSIsInZlcnNpb24iOjIsImxpY2Vuc2UiOnsiZmFpcnBsYXkiOnsiaWdub3JlX2tleXNfaW5fbGljZW5zZV9yZXF1ZXN0Ijp0cnVlfX0sImNvbnRlbnRfa2V5c19zb3VyY2UiOnsiaW5saW5lIjpbeyJpZCI6IjMwMmY4MGRkLTQxMWUtNDg4Ni1iY2E1LWJiMWY4MDE4YTAyNCIsImVuY3J5cHRlZF9rZXkiOiJyb0tBZzB0N0ppMWk0M2Z3dit6ZnRRPT0iLCJpdiI6ImQvMFlpYXIwRkRzSVZVaXp3UGxibWc9PSJ9XX19fQ.NL2btcHvRpeZGnJXrOdyNbNZOLl7Osl9TlGPlb-3a60';

        // HLS stream with FairPlay CBCS encryption (skd:// key delivery)
        var streamUrl = 'https://media.axprod.net/TestVectors/Cmaf/protected_1080p_h264_cbcs/manifest.m3u8';

        shaka.polyfill.installAll();

        var video = document.getElementsByTagName('video')[0];
        var player = new shaka.Player();
        player.attach(video);

        player.configure({
            drm: {
                servers: {
                    'com.apple.fps': licenseUrl + '?AxDrmMessage=' + licenseToken
                },
                advanced: {
                    'com.apple.fps': {
                        serverCertificateUri: 'https://tools.axinom.com/FPScert/fairplay.cer'
                    }
                },
                initDataTransform: (initData, initDataType, drmInfo) => {
                    console.log("========== FairPlay Debug ==========");
                    console.log("initDataType:", initDataType);
                    console.log("initData byteLength:", initData.byteLength);

                    if (initDataType !== 'skd') {
                        console.log("Non-SKD initData type:", initDataType, "-- returning as-is");
                        return initData;
                    }

                    // Extract SKD URL from init data
                    var skdUrl = new TextDecoder().decode(initData);
                    console.log("SKD URL:", skdUrl);

                    // Extract content ID (everything after skd://)
                    var contentId = skdUrl.replace(/^skd:\/\//, '');
                    console.log("Content ID:", contentId);

                    // Transform using Shaka's FairPlay helper
                    var transformed = shaka.drm.FairPlay.initDataTransform(
                        initData, skdUrl, drmInfo.serverCertificate);
                    console.log("Transformed initData length:", transformed.byteLength);
                    console.log("====================================");
                    return transformed;
                }
            },
            streaming: {
                // Use MSE for FairPlay instead of native HLS
                useNativeHlsForFairPlay: false
            }
        });

        player.load(streamUrl).then(() => {
            console.log("Video loaded successfully");
        }).catch((error) => {
            console.error("Load failed:", error);
        });
    })();
    </script>
</body>
</html>
