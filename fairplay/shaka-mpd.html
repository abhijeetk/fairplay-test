        <script src="https://cdn.jsdelivr.net/npm/shaka-player@4/dist/shaka-player.compiled.debug.js"></script>
<script>
(function() {
    shaka.polyfill.installAll();

    var video = document.getElementsByTagName('video')[0];
    var player = new shaka.Player();
    player.attach(video);

    player.configure({
        drm: {
            servers: { 'com.apple.fps': licenseUrl },
            advanced: {
                'com.apple.fps': {
                    serverCertificate: certificate,
                    encryptionScheme: 'cbcs'
                }
            },
            initDataTransform: (initData, initDataType, drmInfo) => {

                console.log("========== FairPlay Debug ==========");

                // 🔹 Step 2.1: initDataType
                console.log("initDataType:", initDataType);

                // 🔹 Step 2.2: raw initData size
                console.log("initData byteLength:", initData.byteLength);

                // 🔹 Try decoding initData (may fail if binary)
                try {
                    const decoded = new TextDecoder().decode(initData);
                    console.log("initData (decoded):", decoded);
                } catch (e) {
                    console.log("initData decode failed (binary data)");
                }

                // 🔹 Dump first few bytes (hex)
                const bytes = new Uint8Array(initData);
                console.log("initData (hex first 32 bytes):",
                    Array.from(bytes.slice(0, 32))
                        .map(b => b.toString(16).padStart(2, '0'))
                        .join(' ')
                );

                // 🔹 Certificate validation
                if (drmInfo && drmInfo.serverCertificate) {
                    console.log("Certificate length:", drmInfo.serverCertificate.byteLength);
                } else {
                    console.error("❌ Missing certificate in drmInfo!");
                }

                // 🔹 Only transform SKD
                if (initDataType !== 'skd') {
                    console.log("Non-SKD initData, returning as-is");
                    return initData;
                }

                // 🔹 Extract SKD URL manually (for visibility)
                let skdUrl = "";
                try {
                    skdUrl = new TextDecoder().decode(initData);
                    console.log("Extracted SKD URL:", skdUrl);
                } catch (e) {
                    console.warn("Could not decode SKD URL");
                }

                // 🔹 Extract content ID
                let contentId = skdUrl.replace(/^skd:\/\//, '');
                console.log("Derived Content ID:", contentId);

                // 🔹 Perform transform
                const transformed = shaka.drm.FairPlay.initDataTransform(
                    initData,
                    skd,
                    drmInfo.serverCertificate
                );

                // 🔹 Validate transformed data
                console.log("Transformed initData length:", transformed.byteLength);

                const transformedBytes = new Uint8Array(transformed);
                console.log("Transformed (hex first 32 bytes):",
                    Array.from(transformedBytes.slice(0, 32))
                        .map(b => b.toString(16).padStart(2, '0'))
                        .join(' ')
                );

                console.log("====================================");

                return transformed;
            }
        }
    });

    player.load(streamUrl).then(() => {
        console.log("✅ Video loaded successfully");
    }).catch((error) => {
        console.error("❌ Load failed:", error);
    });

    console.log(player.getConfiguration());
})();
</script>
