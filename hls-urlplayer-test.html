<!DOCTYPE html>
<html>
<head>
    <title>HLS URLPlayer Test</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 40px; }
        video { width: 80%; max-width: 800px; }
        .info { margin: 20px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>
    <h1>HLS URLPlayer Test</h1>
    <p>This uses native &lt;video src&gt; (no MSE) to trigger AVPlayer URL player path.</p>
    <video id="player"
           src="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
           controls autoplay>
    </video>
    <div class="info">
        <p id="status">Loading...</p>
    </div>
    <script>
        var v = document.getElementById('player');
        var s = document.getElementById('status');
        v.addEventListener('loadstart', function() { s.textContent = 'loadstart'; });
        v.addEventListener('loadedmetadata', function() { s.textContent = 'loadedmetadata: ' + v.videoWidth + 'x' + v.videoHeight; });
        v.addEventListener('playing', function() { s.textContent = 'playing'; });
        v.addEventListener('error', function() { s.textContent = 'error: ' + (v.error ? v.error.message : 'unknown'); });
    </script>
</body>
</html>
